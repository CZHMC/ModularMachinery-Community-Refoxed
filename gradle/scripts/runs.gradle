runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.addAll('--username', "howxu")
        dependencies {
            // spark
            runtime("curse.maven:${spark_id}:${spark_version}")
            // sodium
            runtime("curse.maven:${sodium_id}:${sodium_version}")
            // athena for ctm
            // runtime("curse.maven:${athena_id}:${athena_version}")
            // lithium
            runtime("maven.modrinth:${lithium_id}:${lithium_version}")
            // time in a bottle
            runtime("maven.modrinth:${tiab_id}:${tiab_version}")
            // modern ui
            runtime("maven.modrinth:${mui_id}:${mui_version}")
            // JECharacters
            runtime("curse.maven:${jec_id}:${jec_version}")
            // CustomSkinLoader
            runtime("curse.maven:${csl_id}:${csl_version}")
            // xaero map
            runtime("curse.maven:${minimap_id}:${minimap_version}")
            runtime("curse.maven:${worldmap_id}:${worldmap_version}")
            // aae
            runtime("curse.maven:${aae_id}:${aae_version}")
            runtime("curse.maven:${geckolib_id}:${geckolib_version}")
        }
    }

    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        modSource project.sourceSets.gametest
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
    }

    clientData {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        dependencies {
            // modern ui
            runtime("maven.modrinth:${mui_id}:${mui_version}")
            
        }
    }
}

// Exercise the shipped Mekanism example and KubeJS-created fixtures through the real startup lifecycle.
def prepareRegistryReferenceGameTestScripts = tasks.register('prepareRegistryReferenceGameTestScripts', Copy) {
    from('example') {
        include 'startup_scripts/mekanism/Registry_References.js'
        include 'server_scripts/structure/mekanism/Registry_References.js'
        include 'server_scripts/recipe/mekanism/Registry_References.js'
    }
    from('src/gametest/kubejs')
    into layout.projectDirectory.dir('run/gameTestServer/kubejs')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn prepareRegistryReferenceGameTestScripts
}

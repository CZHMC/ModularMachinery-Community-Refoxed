name: Nightly Dev Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      mod-version: ${{ steps.version.outputs.mod-version }}
      minecraft-version: ${{ steps.version.outputs.minecraft-version }}
      java-version: ${{ steps.version.outputs.java-version }}
      base-tag: ${{ steps.version.outputs.base-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve dev version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_TYPE" != "branch" ] || [[ "$GITHUB_REF_NAME" != neo/* ]]; then
            echo "Nightly releases must run from a neo/** branch" >&2
            exit 1
          fi

          minecraft_version="$(awk -F= '$1 == "minecraft_version" { print $2; exit }' gradle.properties)"
          java_version="$(awk -F= '$1 == "java_version" { print $2; exit }' gradle.properties)"
          if [ -z "$minecraft_version" ] || [ -z "$java_version" ]; then
            echo "minecraft_version and java_version are required in gradle.properties" >&2
            exit 1
          fi

          hash="$(git rev-parse --short HEAD)"
          base_tag="$(git describe --tags --abbrev=0 --first-parent \
            --match "${minecraft_version}-[0-9]*.[0-9]*.[0-9]*" \
            --exclude '*+dev-*' HEAD 2>/dev/null || true)"
          if [ -n "$base_tag" ]; then
            base="${base_tag#"${minecraft_version}-"}"
            if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Nearest release tag ${base_tag} does not use the expected format" >&2
              exit 1
            fi
          else
            base="0.0.0"
          fi

          mod_version="${base}+dev-${hash}"
          version="${minecraft_version}-${mod_version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "mod-version=${mod_version}" >> "$GITHUB_OUTPUT"
          echo "minecraft-version=${minecraft_version}" >> "$GITHUB_OUTPUT"
          echo "java-version=${java_version}" >> "$GITHUB_OUTPUT"
          echo "base-tag=${base_tag}" >> "$GITHUB_OUTPUT"

  release:
    name: Nightly Dev Release ${{ needs.resolve-version.outputs.version }}
    needs: resolve-version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Java ${{ needs.resolve-version.outputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ needs.resolve-version.outputs.java-version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply CI version
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/^mod_version=.*/mod_version=${{ needs.resolve-version.outputs.mod-version }}/m' gradle.properties

      - name: Run Client Data
        run: gradle runClientData

      - name: Run Server Data
        run: gradle runServerData

      - name: Compile Test
        run: gradle compileJava

      - name: Unit Test and GameTest
        run: gradle test

      - name: Gametest Server
        run: gradle runGameTestServer

      - name: Build
        run: gradle build

      - name: Publish to Maven
        run: gradle publish
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Build release notes
        id: notes
        shell: bash
        env:
          DEEPSEEK_TOKEN: ${{ secrets.DEEPSEEK_TOKEN }}
        run: |
          set -euo pipefail

          current_version="${{ needs.resolve-version.outputs.version }}"

          previous_tag="${{ needs.resolve-version.outputs.base-tag }}"
          if [ -n "$previous_tag" ]; then
            range="${previous_tag}..HEAD"
          else
            range="HEAD"
          fi

          commit_data="$(git log "$range" --pretty=format:'%h %s' --no-merges)"
          fallback="$(bash .github/scripts/format-release-notes.sh \
            "${{ needs.resolve-version.outputs.version }}" <<< "$commit_data")"
          full_list="$(bash .github/scripts/format-release-notes.sh --full <<< "$commit_data")"
          if [ -z "$full_list" ]; then
            full_list="- No changes found."
          fi
          changelog="${commit_data:-No changes found.}"

          prompt_template="$(cat .github/prompts/release-notes.md)"
          prompt="$(printf '%s\n\nRelease version: %s\nCommit range: %s\n\nCommits:\n%s' \
            "$prompt_template" "$current_version" "$range" "$changelog")"
          generated=""
          if [ -n "${DEEPSEEK_TOKEN:-}" ]; then
            request="$(jq -n --arg model 'deepseek-v4-flash' --arg prompt "$prompt" \
              '{model: $model, messages: [{role: "user", content: $prompt}], temperature: 0.2}')"
            if response="$(curl --fail --silent --show-error --max-time 120 \
              -X POST 'https://api.deepseek.com/chat/completions' \
              -H 'Content-Type: application/json' \
              -H "Authorization: Bearer ${DEEPSEEK_TOKEN}" \
              --data "$request")"; then
              generated="$(jq -er '.choices[0].message.content' <<< "$response" 2>/dev/null || true)"
            fi
          fi

          if [ -z "$generated" ]; then
            generated="$fallback"
          else
            generated="$(printf '# Release %s\n\n%s\n\n<details>\n<summary>Full commit list</summary>\n\n%s\n\n</details>\n' \
              "${{ needs.resolve-version.outputs.version }}" "$generated" "$full_list")"
          fi

          summary="$(printf '%s\n' "$generated" | awk 'index($0, "<details>") { exit } { print }')"

          {
            body_delimiter="release_body_${RANDOM}_${RANDOM}"
            echo "body<<$body_delimiter"
            printf '%s\n' "$generated"
            echo "$body_delimiter"
            summary_delimiter="release_summary_${RANDOM}_${RANDOM}"
            echo "summary<<$summary_delimiter"
            printf '%s\n' "$summary"
            echo "$summary_delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Publish release artifacts
        uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.resolve-version.outputs.version }}
          github-commitish: ${{ github.sha }}
          name: ${{ needs.resolve-version.outputs.version }}
          version: ${{ needs.resolve-version.outputs.version }}
          version-type: beta
          github-changelog: ${{ steps.notes.outputs.body }}
          modrinth-changelog: ${{ steps.notes.outputs.summary }}
          curseforge-changelog: ${{ steps.notes.outputs.summary }}
          files: build/libs/!(*-@(dev|sources|javadoc|api)).jar
          loaders: neoforge
          environment: client | server
          game-versions: ${{ needs.resolve-version.outputs.minecraft-version }}
          java: ${{ needs.resolve-version.outputs.java-version }}
          modrinth-id: bUctkb7B
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: 1654570
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

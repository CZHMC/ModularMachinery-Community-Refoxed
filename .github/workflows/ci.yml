name: CI/CD

on: [push, pull_request]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Client Data
        run: gradle runClientData

      - name: Run Server Data
        run: gradle runServerData

      - name: Compile Test
        run: gradle compileJava
      
      - name: Unit Test and GameTest
        run: gradle test

      - name: Gametest Server
        run: gradle runGameTestServer